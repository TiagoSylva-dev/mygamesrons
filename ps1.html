<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Emulador PS1</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #000; 
            overflow: hidden; 
        }
        #game { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // ID do seu arquivo no Google Drive
        const DRIVE_ID = '1X883lmhNlkRIQlHGsDEjJAOSq0_xPvKd';
        
        // Novo formato de link de download direto do Google Drive (resolve o erro 404 de download)
        const directDriveUrl = `https://drive.usercontent.google.com/download?id=${DRIVE_ID}&confirm=t`;

        // Configurações do EmulatorJS para PS1
        window.EJS_player = '#game';
        window.EJS_core = 'psx';
        window.EJS_gameUrl = directDriveUrl;
        
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_Buttons = true;

        // Injeta o script do emulador
        let script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS@main/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
