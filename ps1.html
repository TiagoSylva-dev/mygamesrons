<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Emulador PS1</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #000; 
            overflow: hidden; 
        }
        #game { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        // O ID do seu novo arquivo .zip no Google Drive
        const DRIVE_ID = '1tCF-RZ2iJVjLIPq07mmwvgqKmOoAOOUp';
        
        // Formato para forçar o download direto
        const directDriveUrl = `https://drive.usercontent.google.com/download?id=${DRIVE_ID}&confirm=t`;

        // Configurações Oficiais do EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = 'psx';
        window.EJS_startOnLoaded = true;
        window.EJS_Buttons = true;
        
        // Caminho oficial dos arquivos do emulador (mais atualizado e estável)
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

        // Puxando o jogo do seu Google Drive
        window.EJS_gameUrl = directDriveUrl;

        // Injeta o script do emulador na página
        let script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
