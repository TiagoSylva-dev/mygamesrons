<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Emulador PS1 - Castlevania SOTN</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #000; 
            overflow: hidden; 
        }
        #game { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <script>
        window.EJS_player = '#game';
        window.EJS_core = 'psx';
        window.EJS_startOnLoaded = true;
        window.EJS_Buttons = true;
        
        // Caminho oficial dos arquivos do emulador
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

        // O link direto e sem bloqueios do seu GitHub Releases
        window.EJS_gameUrl = 'https://github.com/TiagoSylva-dev/mygamesrons/releases/download/v1.0/castlevaniasymphonyofthenight.zip';

        // Injeta o script do emulador na página
        let script = document.createElement('script');
        script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
