<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNES Emulator</title>
    <style>
        /* 1. Reset e cor de fundo principal baseada na carcaça do controle SNES */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #d8d8d8; /* Cinza claro do controle */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 2. Container principal do jogo */
        #game-container {
            width: 100vw;
            height: 100vh;
        }

        /* 3. Modo Vertical (Portrait) - Estilo Afterplay */
        @media screen and (orientation: portrait) {
            #game-container {
                /* Fundo com o cinza um pouco mais escuro, lembrando o detalhe circular dos botões A/B/X/Y */
                background-color: #b0b0b0; 
            }
        }

        /* 4. Modo Horizontal (Landscape) */
        @media screen and (orientation: landscape) {
            #game-container {
                /* No horizontal, o fundo preto atrás do jogo dá mais contraste e imersão */
                background-color: #000000; 
            }
        }
    </style>
</head>
<body>

    <!-- Div onde o emulador será injetado -->
    <div id="game-container">
        <div style="width:100%;height:100%;max-width:100%">
            <div id="game"></div>
        </div>
    </div>

    <script>
        // Configurações do EmulatorJS
        window.EJS_player = '#game';
        window.EJS_core = 'snes';
        
        // A lógica de puxar a ROM da pasta correta que estabelecemos antes
        window.EJS_gameUrl = 'roms/snes/donkeykong2.zip'; 
        
        // Personalização de Cores
        window.EJS_color = '#4a4a4a'; // Cinza escuro do direcional (D-pad) para os menus
        window.EJS_theme = 'light'; // Mantém os painéis mais claros para casar com o estilo cinza
        
        // Sistema de Save via IndexedDB para evitar perdas
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';
    </script>
    <script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

</body>
</html>
